name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen --group dev
      - uses: j178/prek-action@v2
        with:
          prek-version: "0.4.5"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --group dev --python ${{ matrix.python-version }}
      - run: uv run --frozen --python ${{ matrix.python-version }} pytest --cov=analint --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  tlc:
    name: TLC conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen --group dev
      - name: Download and verify TLC 1.7.4
        env:
          ANALINT_TLC_JAR: ${{ runner.temp }}/tla2tools-1.7.4.jar
        run: |
          curl --fail --location --retry 3 \
            --output "$ANALINT_TLC_JAR" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          printf '%s  %s\n' \
            936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88 \
            "$ANALINT_TLC_JAR" | sha256sum --check --strict
          printf 'ANALINT_TLC_JAR=%s\n' "$ANALINT_TLC_JAR" >> "$GITHUB_ENV"
      - name: Require Java and the pinned TLC JAR
        run: uv run --frozen python -c "from analint.backends.tlc import find_tlc; print(find_tlc())"
      - name: Check Python and TLC conformance
        run: >-
          uv run --frozen pytest -q -rs
          tests/test_tlc_backend.py
          tests/test_fixed_initial.py
          tests/test_initial_presence.py
          tests/test_keys.py

  package:
    name: release verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv build
      - name: Verify built distributions
        run: >-
          uv run --no-project --python ${{ matrix.python-version }}
          python -I scripts/check_release.py --dist-dir dist
