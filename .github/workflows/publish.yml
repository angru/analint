name: Publish

# Trusted Publishing (OIDC) — no API tokens stored anywhere.
#   * Manual run → TestPyPI dry run (verify_only skips publication)
#   * Publishing a GitHub Release (tag vX.Y.Z)        → PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify artifacts without publishing to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  verify:
    name: Verify release (${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Verify the artifacts that will be published
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          uv run --no-project --python ${{ matrix.python-version }}
          python -I scripts/check_release.py --dist-dir dist
          --expected-version "$RELEASE_TAG"

  testpypi:
    name: Publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch' && !inputs.verify_only
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
